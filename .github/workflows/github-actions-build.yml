name: "CI Build Check"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    # Job name is test
    name: Build
    runs-on: macOS-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v1

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 2.7.2

    - name: Bundle Update
      run: gem install bundler:2.2.14
    - name: Bundle Install
      run: bundle install

    - uses: maierj/fastlane-action@v2.0.1
      with:
        lane: 'build'
